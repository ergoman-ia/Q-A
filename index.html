<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>근골격계부담작업 유해요인조사 Q&A</title>

    <!-- 한글 가독성을 위한 Pretendard. 실패해도 시스템 폰트로 즉시 렌더(폰트 때문에 첫 화면이 늦지 않음) -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
        media="print" onload="this.media='all'" />

    <style>
        /* ============================================================
           디자인 토큰 — 산업안전보건의 '점검 기록' 정서
           teal(차분/임상적 신뢰) + amber(주의 환기) + 모노 타임스탬프
           ============================================================ */
        :root {
            --ink: #16242e;
            --ink-soft: #4a5c66;
            --ink-faint: #8a989f;

            --petrol: #0e5b6b;
            --petrol-deep: #0a4651;
            --petrol-tint: #e3eef0;

            --amber: #e07a2f;
            --amber-deep: #c4641e;

            --mist: #eaeeef;
            --surface: #ffffff;
            --line: #dde4e5;
            --line-soft: #eef2f3;

            --ok: #1f8a5b;
            --ok-tint: #e7f3ec;
            --danger: #c4423a;
            --danger-tint: #fbe9e8;

            --radius: 14px;
            --radius-sm: 9px;
            --shadow: 0 1px 2px rgba(16, 36, 46, .05), 0 10px 30px -18px rgba(16, 36, 46, .28);
            --mono: ui-monospace, "SFMono-Regular", "Menlo", "Consolas", monospace;
            --sans: "Pretendard", "Pretendard Variable", -apple-system, BlinkMacSystemFont,
                "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--sans);
            color: var(--ink);
            background:
                radial-gradient(120% 60% at 50% -10%, #f3f6f6 0%, var(--mist) 55%) fixed;
            -webkit-font-smoothing: antialiased;
            line-height: 1.6;
            min-height: 100vh;
            padding: clamp(16px, 4vw, 40px) 16px 56px;
            display: flex;
            justify-content: center;
        }

        .shell {
            width: 100%;
            max-width: 640px;
        }

        /* ── 헤더 ───────────────────────────────────────────── */
        .masthead {
            margin-bottom: 18px;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: .06em;
            color: var(--petrol);
            background: var(--petrol-tint);
            padding: 5px 11px;
            border-radius: 999px;
            margin-bottom: 12px;
        }

        .eyebrow .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--petrol);
            box-shadow: 0 0 0 3px rgba(14, 91, 107, .18);
        }

        h1 {
            margin: 0;
            font-size: clamp(21px, 5vw, 27px);
            font-weight: 800;
            letter-spacing: -.02em;
            line-height: 1.28;
            color: var(--ink);
            text-align:center;
        }

        /* ── 카드(패널) 공통 ────────────────────────────────── */
        .panel {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        /* ===== 사용자 모드 ===== */
        #userMode {
            margin-top: 18px;
        }

        .submit-panel {
            padding: clamp(20px, 5vw, 30px);
        }

        .lead {
            font-size: 15px;
            color: var(--ink-soft);
            margin: 0 0 22px;
        }

        .lead .anon {
            color: var(--amber-deep);
            font-weight: 800;
            border-bottom: 2px solid rgba(224, 122, 47, .35);
            padding-bottom: 1px;
        }

        .field-label {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            font-size: 13px;
            font-weight: 700;
            color: var(--ink);
            margin-bottom: 8px;
        }

        .field-label .count {
            font-family: var(--mono);
            font-size: 12px;
            font-weight: 500;
            color: var(--ink-faint);
        }

        textarea {
            width: 100%;
            min-height: 168px;
            padding: 15px 16px;
            font-family: var(--sans);
            font-size: 16px;
            line-height: 1.65;
            color: var(--ink);
            background: #fcfdfd;
            border: 1.5px solid var(--line);
            border-radius: var(--radius-sm);
            resize: vertical;
            transition: border-color .15s, box-shadow .15s, background .15s;
        }

        textarea::placeholder {
            color: var(--ink-faint);
        }

        textarea:focus {
            outline: none;
            border-color: var(--petrol);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(14, 91, 107, .12);
        }

        .btn {
            -webkit-appearance: none;
            appearance: none;
            font-family: var(--sans);
            font-weight: 700;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: transform .08s ease, background .18s, box-shadow .18s, color .18s;
        }

        .btn:active {
            transform: translateY(1px);
        }

        .btn:disabled {
            cursor: not-allowed;
            opacity: .65;
            transform: none;
        }

        .btn-primary {
            width: 100%;
            margin-top: 16px;
            padding: 15px;
            font-size: 16px;
            color: #fff;
            background: var(--amber);
            box-shadow: 0 8px 18px -10px rgba(196, 100, 30, .9);
        }

        .btn-primary:hover:not(:disabled) {
            background: var(--amber-deep);
        }

        .status {
            min-height: 20px;
            margin-top: 12px;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            opacity: 0;
            transition: opacity .2s;
        }

        .status.show {
            opacity: 1;
        }

        .status.success {
            color: var(--ok);
        }

        .status.error {
            color: var(--danger);
        }

        /* 사용자 안내 푸터 */
        .reassure {
            display: flex;
            gap: 12px;
            align-items: flex-start;
            margin-top: 16px;
            padding: 14px 16px;
            background: var(--petrol-tint);
            border-radius: var(--radius-sm);
            font-size: 13px;
            color: var(--petrol-deep);
            line-height: 1.55;
        }

        .reassure svg {
            flex: 0 0 auto;
            margin-top: 1px;
        }

        /* 관리자 진입(데스크톱 전용) */
        .admin-entry {
            margin-top: 22px;
            text-align: center;
        }

        #goToAdminBtn {
            background: none;
            border: none;
            font-family: var(--sans);
            font-size: 12.5px;
            color: var(--ink-faint);
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 8px;
            transition: color .15s, background .15s;
        }

        #goToAdminBtn:hover {
            color: var(--petrol);
            background: var(--petrol-tint);
        }

        /* ===== 관리자 모드 ===== */
        #adminMode {
            display: none;
            margin-top: 18px;
        }

        .admin-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
        }

        .admin-bar .who {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 14px;
            color: var(--ink);
        }

        .admin-bar .who .pin {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--ok);
            box-shadow: 0 0 0 3px var(--ok-tint);
        }

        .btn-logout {
            margin-left: auto;
            padding: 8px 14px;
            font-size: 13px;
            color: var(--danger);
            background: var(--danger-tint);
        }

        .btn-logout:hover {
            background: #f6dcda;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            padding: 12px 14px;
            margin-bottom: 16px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius-sm);
        }

        .toolbar label {
            font-size: 13px;
            font-weight: 700;
            color: var(--ink-soft);
        }

        .toolbar input[type="date"] {
            font-family: var(--mono);
            font-size: 13px;
            padding: 7px 9px;
            border: 1px solid var(--line);
            border-radius: 8px;
            color: var(--ink);
            background: #fcfdfd;
        }

        .toolbar input[type="date"]:focus {
            outline: none;
            border-color: var(--petrol);
            box-shadow: 0 0 0 3px rgba(14, 91, 107, .12);
        }

        .toolbar input[type="text"] {
            flex: 1 1 120px;
            min-width: 90px;
            font-family: var(--sans);
            font-size: 13px;
            padding: 7px 10px;
            border: 1px solid var(--line);
            border-radius: 8px;
            color: var(--ink);
            background: #fcfdfd;
        }

        .toolbar input[type="text"]:focus {
            outline: none;
            border-color: var(--petrol);
            box-shadow: 0 0 0 3px rgba(14, 91, 107, .12);
        }

        .btn-tool {
            padding: 7px 12px;
            font-size: 13px;
            color: var(--petrol-deep);
            background: var(--petrol-tint);
        }

        .btn-tool:hover:not(:disabled) {
            background: #d3e4e7;
        }

        .btn-tool.danger {
            color: var(--danger);
            background: var(--danger-tint);
        }

        .btn-tool.danger:hover:not(:disabled) {
            background: #f6dcda;
        }

        .toolbar .spacer {
            flex: 1 1 auto;
        }

        .count-badge {
            font-family: var(--mono);
            font-size: 12px;
            color: var(--ink-faint);
        }

        /* ── 페이지네이션 ───────────────────────────────────── */
        .pager {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 18px;
            padding-top: 14px;
            border-top: 1px solid var(--line-soft);
        }

        .pager button {
            min-width: 34px;
            height: 34px;
            padding: 0 9px;
            font-family: var(--mono);
            font-size: 13px;
            color: var(--ink-soft);
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: background .15s, border-color .15s, color .15s;
        }

        .pager button:hover:not(:disabled):not(.is-current) {
            background: var(--petrol-tint);
            border-color: #cfe0e3;
            color: var(--petrol-deep);
        }

        .pager button.is-current {
            background: var(--petrol);
            border-color: var(--petrol);
            color: #fff;
            font-weight: 600;
            cursor: default;
        }

        .pager button.nav {
            font-size: 17px;
            line-height: 1;
            color: var(--petrol-deep);
        }

        .pager button:disabled {
            opacity: .38;
            cursor: not-allowed;
        }

        .pager .gap {
            color: var(--ink-faint);
            padding: 0 2px;
            user-select: none;
            letter-spacing: 1px;
        }

        /* ── 공개 질문 목록(모든 접속자, 읽기 전용) ─────────── */
        .public-panel {
            padding: clamp(16px, 4vw, 22px) clamp(16px, 4vw, 24px);
            margin-bottom: 16px;
        }

        .public-head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 14px;
        }

        .public-head .title {
            font-size: 15px;
            font-weight: 800;
            letter-spacing: -.01em;
            color: var(--ink);
        }

        .public-head .public-count {
            font-family: var(--mono);
            font-size: 12px;
            color: var(--ink-faint);
        }

        #publicList {
            display: flex;
            flex-direction: column;
            gap: 11px;
        }

        .p-record {
            position: relative;
            background: var(--surface);
            border: 1px solid var(--line);
            border-left: 4px solid var(--petrol);
            border-radius: var(--radius-sm);
            padding: 12px 38px 12px 15px;   /* 오른쪽은 캐럿 자리 */
            cursor: pointer;
            animation: pop .22s ease both;
            transition: border-color .15s, box-shadow .15s, background .15s;
        }

        .p-record:hover {
            border-color: #cfe0e3;
            box-shadow: 0 6px 18px -14px rgba(16, 36, 46, .5);
        }

        .p-record.is-answered {
            border-left-color: var(--ok);
        }

        /* 펼침/접힘 표시 캐럿(오른쪽 위) */
        .p-caret {
            position: absolute;
            top: 12px;
            right: 12px;
            font-size: 12px;
            line-height: 1;
            color: var(--ink-faint);
            transition: transform .18s ease;
            pointer-events: none;
        }

        .p-record.expanded .p-caret {
            transform: rotate(180deg);
            color: var(--petrol);
        }

        /* 헤더(날짜·배지)는 확장했을 때만 노출 */
        .p-rec-head {
            display: none;
            align-items: center;
            gap: 10px;
            margin-bottom: 7px;
        }

        .p-record.expanded .p-rec-head {
            display: flex;
        }

        .p-rec-time {
            font-family: var(--mono);
            font-size: 12px;
            color: var(--ink-faint);
            letter-spacing: -.01em;
        }

        .badge-answered {
            margin-left: auto;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 11.5px;
            font-weight: 700;
            color: var(--ok);
            background: var(--ok-tint);
            padding: 3px 9px;
            border-radius: 999px;
            white-space: nowrap;
        }

        /* 접힘: 한 줄 + … / 확장: 전체 */
        .p-rec-body {
            margin: 0;
            font-size: 15px;
            line-height: 1.62;
            color: var(--ink);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .p-record.expanded .p-rec-body {
            white-space: pre-wrap;
            word-break: break-word;
            overflow: visible;
        }

        /* ── 질문 레코드 카드 ───────────────────────────────── */
        #questionList {
            display: flex;
            flex-direction: column;
            gap: 11px;
        }

        .record {
            position: relative;
            background: var(--surface);
            border: 1px solid var(--line);
            border-left: 4px solid var(--amber);
            border-radius: var(--radius-sm);
            padding: 14px 16px;
            animation: pop .22s ease both;
        }

        @keyframes pop {
            from {
                opacity: 0;
                transform: translateY(4px);
            }
        }

        /* 최신화로 끌어온 '방금 들어온' 질문을 잠깐 강조 — 어느 게 새 질문인지 눈에 띄게 */
        .record.flash {
            animation: pop .22s ease both, flash 2.2s ease-out .15s both;
        }

        @keyframes flash {
            0% {
                background: var(--amber);
                box-shadow: 0 0 0 3px rgba(224, 122, 47, .25);
            }
            18% {
                background: #fdf0e4;
            }
            100% {
                background: var(--surface);
                box-shadow: 0 0 0 0 rgba(224, 122, 47, 0);
            }
        }

        /* 답변완료 → 흐리게 처리하지 않고, 좌측 보더만 초록으로 표시 */
        .record.answered {
            border-left-color: var(--ok);
        }

        .rec-head {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 9px;
        }

        .rec-time {
            font-family: var(--mono);
            font-size: 12px;
            color: var(--ink-faint);
            letter-spacing: -.01em;
        }

        .rec-actions {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .chk {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12.5px;
            font-weight: 600;
            color: var(--ink-soft);
            cursor: pointer;
            user-select: none;
            padding: 4px 8px;
            border-radius: 8px;
            transition: background .15s;
        }

        .chk:hover {
            background: var(--line-soft);
        }

        .chk input {
            width: 16px;
            height: 16px;
            accent-color: var(--ok);
            cursor: pointer;
        }

        .del {
            width: 30px;
            height: 30px;
            display: grid;
            place-items: center;
            border: none;
            background: none;
            border-radius: 8px;
            color: var(--ink-faint);
            cursor: pointer;
            transition: background .15s, color .15s;
        }

        .del:hover:not(:disabled) {
            background: var(--danger-tint);
            color: var(--danger);
        }

        .del:disabled {
            opacity: .4;
            cursor: not-allowed;
        }

        .rec-body {
            margin: 0;
            white-space: pre-wrap;
            word-break: break-word;
            font-size: 15px;
            line-height: 1.62;
            color: var(--ink);
        }

        /* 상태 표시(로딩/빈목록/에러) */
        .state-note {
            text-align: center;
            padding: 44px 16px;
            color: var(--ink-faint);
            font-size: 14px;
        }

        .state-note.error {
            color: var(--danger);
        }

        .spin {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2.5px solid var(--line);
            border-top-color: var(--petrol);
            border-radius: 50%;
            animation: rot .7s linear infinite;
            vertical-align: -4px;
            margin-right: 8px;
        }

        @keyframes rot {
            to {
                transform: rotate(360deg);
            }
        }

        /* ── 비밀번호 모달 ──────────────────────────────────── */
        .overlay {
            position: fixed;
            inset: 0;
            display: none;
            place-items: center;
            padding: 20px;
            background: rgba(16, 36, 46, .58);
            z-index: 100;
        }

        .overlay.active {
            display: grid;
        }

        .modal {
            width: 100%;
            max-width: 330px;
            background: var(--surface);
            border-radius: var(--radius);
            padding: 26px 22px 20px;
            box-shadow: 0 24px 60px -20px rgba(16, 36, 46, .5);
            animation: rise .2s ease both;
        }

        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(8px) scale(.98);
            }
        }

        .modal h2 {
            margin: 0 0 4px;
            font-size: 17px;
            font-weight: 800;
            color: var(--ink);
            text-align: center;
        }

        .modal p {
            margin: 0 0 18px;
            font-size: 12.5px;
            color: var(--ink-faint);
            text-align: center;
        }

        .pwd-wrap {
            position: relative;
        }

        .pwd-wrap input {
            width: 100%;
            padding: 12px 42px 12px 13px;
            font-family: var(--sans);
            font-size: 15px;
            border: 1.5px solid var(--line);
            border-radius: var(--radius-sm);
            background: #fcfdfd;
        }

        .pwd-wrap input:focus {
            outline: none;
            border-color: var(--petrol);
            box-shadow: 0 0 0 4px rgba(14, 91, 107, .12);
        }

        .pwd-toggle {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            width: 32px;
            height: 32px;
            display: grid;
            place-items: center;
            border: none;
            background: none;
            font-size: 16px;
            color: var(--ink-faint);
            cursor: pointer;
            border-radius: 8px;
        }

        .modal-error {
            min-height: 18px;
            margin: 8px 2px 0;
            font-size: 12.5px;
            font-weight: 600;
            color: var(--danger);
            text-align: center;
        }

        .modal-btns {
            display: flex;
            gap: 9px;
            margin-top: 14px;
        }

        .modal-btns .btn {
            flex: 1;
            padding: 12px;
            font-size: 14.5px;
        }

        .btn-ghost {
            color: var(--ink-soft);
            background: var(--line-soft);
        }

        .btn-ghost:hover {
            background: var(--line);
        }

        .btn-confirm {
            color: #fff;
            background: var(--petrol);
        }

        .btn-confirm:hover:not(:disabled) {
            background: var(--petrol-deep);
        }

        /* ── 스마트폰: 관리자 진입 자체를 숨김 ─────────────── */
        @media (max-width: 768px) {
            .admin-entry {
                display: none !important;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: .001ms !important;
                transition-duration: .001ms !important;
            }
        }
    </style>
</head>

<body>
    <div class="shell">
        <header class="masthead">
            <h1>근골격계부담작업 유해요인조사 Q&amp;A</h1>
        </header>

        <!-- ===== 사용자 모드 ===== -->
        <div id="userMode">
            <!-- 공개 질문 목록 (모든 접속자가 볼 수 있음, 읽기 전용) -->
            <section class="panel public-panel">
                <div class="public-head">
                    <span class="title">등록된 질문</span>
                    <span class="public-count" id="publicCount"></span>
                </div>
                <div id="publicList"></div>
            </section>

            <div class="panel submit-panel">
                <p class="lead">
                    근골격계부담작업 유해요인조사에 관해 궁금한 점이 있으면 자유롭게 질문해 주세요.
                    모든 내용은 <span class="anon">익명</span>으로 처리됩니다.
                </p>

                <form id="qaForm">
                    <div class="field-label">
                        <span>질문 내용</span>
                        <span class="count" id="charCount">0자</span>
                    </div>
                    <textarea id="questionContent"
                        placeholder="질문할 내용을 입력하세요." required></textarea>

                    <button type="submit" class="btn btn-primary" id="submitBtn">질문하기</button>
                    <div class="status" id="submitStatus"></div>
                </form>

                <div class="reassure">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="3" y="11" width="18" height="11" rx="2" />
                        <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                    </svg>
                    <span>본 도구는 <b>안전보건교육원 근골격계부담작업 유해요인조사 작성실무 과정</b> 전용으로 운영됩니다.</span>
                </div>
            </div>

            <div class="admin-entry">
                <button id="goToAdminBtn" type="button">관리자 모드</button>
            </div>
        </div>

        <!-- ===== 관리자 모드 (데스크톱 전용) ===== -->
        <div id="adminMode">
            <div class="admin-bar">
                <span class="who"><span class="pin"></span>관리자 모드</span>
                <button id="goToUserBtn" type="button" class="btn btn-logout">로그아웃</button>
            </div>

            <div class="toolbar">
                <label for="dateFilter">날짜</label>
                <input type="date" id="dateFilter" />
                <button id="refreshDataBtn" type="button" class="btn btn-tool">최신화</button>
                <input type="text" id="searchKeyword" placeholder="키워드 검색" autocomplete="off" />
                <button id="searchBtn" type="button" class="btn btn-tool">검색하기</button>
                <span class="spacer"></span>
                <span class="count-badge" id="listCount"></span>
                <button id="deleteAllBtn" type="button" class="btn btn-tool danger">전체 삭제</button>
            </div>

            <div id="questionList"></div>
        </div>
    </div>

    <!-- ===== 비밀번호 모달 ===== -->
    <div class="overlay" id="pwdModal">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="pwdTitle">
            <h2 id="pwdTitle">관리자 로그인</h2>
            <p>등록된 질문을 확인하려면 비밀번호를 입력하세요.</p>
            <div class="pwd-wrap">
                <input type="password" id="pwdInput" placeholder="비밀번호" autocomplete="off"
                    inputmode="text" />
                <button type="button" class="pwd-toggle" id="pwdToggle" aria-label="비밀번호 표시">👁</button>
            </div>
            <div class="modal-error" id="pwdError"></div>
            <div class="modal-btns">
                <button type="button" class="btn btn-ghost" id="pwdCancel">취소</button>
                <button type="button" class="btn btn-confirm" id="pwdConfirm">확인</button>
            </div>
        </div>
    </div>

    <script>
        "use strict";

        /* =====================================================================
           DB 계약(원본 그대로) — 절대 변경 금지
           Google Apps Script + Google Sheets 백엔드
           ===================================================================== */
        const API_URL = "https://script.google.com/macros/s/AKfycbyZsEEG0T4RR5T3UrnMD-KuBkpKjlxtv62Fgl0JNhvNZFemObCex1EKLzX2auVB9yoebg/exec";
        const ADMIN_HASH = "d7e46480f7570a02bbe655c893bc6259052f596267db07938574d94340849e36";
        const POLL_MS = 30000;          // 백그라운드 새로고침 주기(원본과 동일: 30초)
        const MOBILE_QUERY = "(max-width: 768px)";

        /* ── 요소 캐싱 ─────────────────────────────────────────── */
        const $ = (id) => document.getElementById(id);
        const userMode = $("userMode");
        const adminMode = $("adminMode");
        const form = $("qaForm");
        const questionContent = $("questionContent");
        const charCount = $("charCount");
        const submitBtn = $("submitBtn");
        const submitStatus = $("submitStatus");
        const goToAdminBtn = $("goToAdminBtn");
        const goToUserBtn = $("goToUserBtn");
        const questionList = $("questionList");
        const dateFilter = $("dateFilter");
        const refreshDataBtn = $("refreshDataBtn");
        const searchKeyword = $("searchKeyword");
        const searchBtn = $("searchBtn");
        const deleteAllBtn = $("deleteAllBtn");
        const listCount = $("listCount");

        const publicList = $("publicList");
        const publicCount = $("publicCount");

        const pwdModal = $("pwdModal");
        const pwdInput = $("pwdInput");
        const pwdToggle = $("pwdToggle");
        const pwdConfirm = $("pwdConfirm");
        const pwdCancel = $("pwdCancel");
        const pwdError = $("pwdError");

        /* ── 상태 ──────────────────────────────────────────────── */
        let adminKey = "";
        let allQuestions = [];
        let lastDataString = "";
        const pendingToggles = new Map();   // key: q.date, value: 원하는 체크 상태(boolean)
        let pollTimer = null;

        let activeSearch = "";              // 관리자 키워드 검색어(검색하기 클릭 시 적용)
        let flashNewest = false;            // 최신화 시 1회만 새 질문 카드 강조

        const isMobile = () => window.matchMedia(MOBILE_QUERY).matches;

        /* =====================================================================
           공통 유틸
           ===================================================================== */
        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // isAnswered 정규화 (true / "true" / "TRUE" / "O" 모두 true)
        function toBool(v) {
            return v === true || v === "true" || v === "TRUE" || v === "O";
        }

        async function hashPassword(pwd) {
            const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(pwd));
            return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
        }

        // 공용 POST (원본과 동일한 헤더/본문 규약 유지)
        async function apiPost(payload) {
            const res = await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                redirect: "follow",
                body: JSON.stringify(payload)
            });
            if (!res.ok) throw new Error("서버 오류: " + res.status);
            return res.json();
        }

        function showStatus(msg, type) {
            submitStatus.textContent = msg;
            submitStatus.className = "status show " + (type || "");
        }
        function clearStatus() {
            submitStatus.className = "status";
            submitStatus.textContent = "";
        }

        /* =====================================================================
           [공개] 모든 접속자 — 질문 목록 (읽기 전용 · 아코디언)
           GET ?public=1&t=...  →  [{ date, content, isAnswered }]
           ★ 관리자 키를 전혀 사용하지 않음 → 삭제/수정 권한은 노출되지 않음
           · 기본은 한 줄(내용 …으로 축약)만 노출
           · 클릭하면 전체 확장(한 번에 하나만 — 다른 걸 누르면 이전 건 접힘)
           · 확장 후 아무 조작 없이 30초가 지나면 자동으로 다시 접힘
           ===================================================================== */
        const PUBLIC_AUTO_COLLAPSE_MS = 30000;   // 30초 후 자동 복구
        let publicQuestions = [];
        let publicOpenEl = null;                 // 현재 확장된 카드
        let publicCollapseTimer = null;          // 30초 타이머

        async function fetchPublicQuestions(showSpinner) {
            if (showSpinner) {
                publicList.innerHTML =
                    '<div class="state-note"><span class="spin"></span>질문을 불러오는 중…</div>';
            }
            try {
                const res = await fetch(
                    API_URL + "?public=1&t=" + Date.now(),
                    { redirect: "follow" }
                );
                if (!res.ok) throw new Error("서버 오류: " + res.status);
                const data = await res.json();
                if (data && data.error) throw new Error(String(data.error));
                publicQuestions = Array.isArray(data) ? data : [];
                renderPublicList();
            } catch (err) {
                console.error("[public]", err);
                publicList.innerHTML =
                    '<div class="state-note">등록된 질문이 없거나, 목록을 불러오지 못했습니다.</div>';
                publicCount.textContent = "";
            }
        }

        // 30초 타이머 정리
        function clearPublicTimer() {
            if (publicCollapseTimer) { clearTimeout(publicCollapseTimer); publicCollapseTimer = null; }
        }

        // 카드 접기
        function collapsePublicCard(el) {
            if (!el) return;
            el.classList.remove("expanded");
            if (publicOpenEl === el) publicOpenEl = null;
        }

        // 카드 펼치기(하나만) + 30초 자동 복구 예약
        function expandPublicCard(el) {
            if (publicOpenEl && publicOpenEl !== el) collapsePublicCard(publicOpenEl);
            el.classList.add("expanded");
            publicOpenEl = el;
            clearPublicTimer();
            publicCollapseTimer = setTimeout(() => {
                collapsePublicCard(el);
                publicCollapseTimer = null;
            }, PUBLIC_AUTO_COLLAPSE_MS);
        }

        function renderPublicList() {
            // 재렌더 시 확장 상태·타이머 초기화(그전 DOM은 사라짐)
            clearPublicTimer();
            publicOpenEl = null;

            const total = publicQuestions.length;
            publicCount.textContent = total ? total + "건" : "";

            if (!total) {
                publicList.innerHTML =
                    '<div class="state-note">아직 등록된 질문이 없습니다. 첫 질문을 남겨보세요.</div>';
                return;
            }

            const frag = document.createDocumentFragment();
            for (let k = 0; k < total; k++) {
                const q = publicQuestions[total - 1 - k];             // 최신순
                const answered = toBool(q.isAnswered);

                const card = document.createElement("div");
                card.className = answered ? "p-record is-answered" : "p-record";
                card.innerHTML =
                    '<span class="p-caret" aria-hidden="true">▾</span>' +
                    '<div class="p-rec-head">' +
                        '<span class="p-rec-time">' + escapeHtml(q.date) + '</span>' +
                        (answered ? '<span class="badge-answered">답변완료</span>' : '') +
                    '</div>' +
                    '<p class="p-rec-body">' + escapeHtml(q.content) + '</p>';
                frag.appendChild(card);
            }
            publicList.replaceChildren(frag);
        }

        // 클릭(이벤트 위임): 같은 카드 → 접기 / 다른 카드 → 이전 접고 확장
        publicList.addEventListener("click", (e) => {
            const card = e.target.closest(".p-record");
            if (!card) return;
            if (card === publicOpenEl) {
                clearPublicTimer();
                collapsePublicCard(card);
            } else {
                expandPublicCard(card);
            }
        });

        /* =====================================================================
           [흐름 1] 사용자 — 질문 제출
           POST { type:"question", content, date }  (date = ko-KR 로컬 문자열)
           ===================================================================== */
        questionContent.addEventListener("input", () => {
            charCount.textContent = questionContent.value.length + "자";
        });

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            const content = questionContent.value.trim();
            if (!content) {
                showStatus("내용을 입력해 주세요.", "error");
                questionContent.focus();
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = "등록 중…";
            clearStatus();

            const date = new Date().toLocaleString("ko-KR");

            try {
                const result = await apiPost({ type: "question", content, date });
                if (result.result === "success") {
                    form.reset();
                    charCount.textContent = "0자";
                    showStatus("질문이 등록되었습니다. 감사합니다.", "success");
                    setTimeout(clearStatus, 3000);
                    // 방금 등록한 질문이 목록 맨 위에 바로 보이도록 새로고침
                    fetchPublicQuestions(false);
                } else {
                    throw new Error(result.message || "알 수 없는 오류가 발생했습니다.");
                }
            } catch (err) {
                showStatus("등록 실패 · " + err.message, "error");
                console.error(err);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = "질문하기";
            }
        });

        /* =====================================================================
           [흐름 2] 관리자 진입 — 비밀번호 모달 (스마트폰에서는 진입 불가)
           ===================================================================== */
        function openModal() {
            // 스마트폰에서는 관리자 모드 자체를 노출하지 않음 (CSS 숨김 + JS 2차 차단)
            if (isMobile()) return;
            pwdInput.value = "";
            pwdInput.type = "password";
            pwdToggle.textContent = "👁";
            pwdError.textContent = "";
            pwdModal.classList.add("active");
            setTimeout(() => pwdInput.focus(), 50);
        }
        function closeModal() {
            pwdModal.classList.remove("active");
            pwdInput.value = "";
            pwdError.textContent = "";
        }

        goToAdminBtn.addEventListener("click", openModal);
        pwdCancel.addEventListener("click", closeModal);
        pwdModal.addEventListener("click", (e) => { if (e.target === pwdModal) closeModal(); });

        pwdToggle.addEventListener("click", () => {
            const show = pwdInput.type === "password";
            pwdInput.type = show ? "text" : "password";
            pwdToggle.textContent = show ? "🙈" : "👁";
        });

        pwdInput.addEventListener("keydown", (e) => { if (e.key === "Enter") pwdConfirm.click(); });

        pwdConfirm.addEventListener("click", async () => {
            const pwd = pwdInput.value;
            if (!pwd) { pwdError.textContent = "비밀번호를 입력하세요."; return; }

            pwdConfirm.disabled = true;
            pwdConfirm.textContent = "확인 중…";

            try {
                const hashed = await hashPassword(pwd);
                if (hashed === ADMIN_HASH) {
                    adminKey = pwd;                 // 원본과 동일: 평문 키를 서버 검증에 사용
                    closeModal();
                    enterAdmin();
                } else {
                    pwdError.textContent = "비밀번호가 일치하지 않습니다.";
                    pwdInput.value = "";
                    pwdInput.focus();
                }
            } finally {
                pwdConfirm.disabled = false;
                pwdConfirm.textContent = "확인";
            }
        });

        function enterAdmin() {
            userMode.style.display = "none";
            adminMode.style.display = "block";
            activeSearch = "";
            if (searchKeyword) searchKeyword.value = "";
            fetchQuestions();
            startPolling();
        }

        function exitAdmin() {
            stopPolling();
            adminMode.style.display = "none";
            userMode.style.display = "block";
            adminKey = "";
            lastDataString = "";
            allQuestions = [];
            pendingToggles.clear();
            dateFilter.value = "";
            questionList.innerHTML = "";
            // 관리자가 삭제/변경했을 수 있으므로 공개 목록도 최신화
            fetchPublicQuestions(false);
        }

        goToUserBtn.addEventListener("click", exitAdmin);

        /* =====================================================================
           [흐름 3] 관리자 — 목록 조회
           GET ?adminKey=...&t=...  →  [{ date, content, isAnswered }]
           ===================================================================== */
        async function fetchQuestions(isBackground = false) {
            if (!isBackground) {
                questionList.innerHTML = '<div class="state-note"><span class="spin"></span>목록을 불러오는 중…</div>';
            }
            try {
                const res = await fetch(
                    API_URL + "?adminKey=" + encodeURIComponent(adminKey) + "&t=" + Date.now(),
                    { redirect: "follow" }
                );
                if (!res.ok) throw new Error("서버 오류: " + res.status);
                const newData = await res.json();

                if (newData && newData.error === "unauthorized") throw new Error("인증 실패");

                // 서버가 이미 반영한 토글은 보류 목록에서 해제 (체크 풀림 방지)
                if (Array.isArray(newData) && pendingToggles.size) {
                    for (const [date, desired] of pendingToggles) {
                        const row = newData.find(r => r.date === date);
                        if (row && toBool(row.isAnswered) === desired) pendingToggles.delete(date);
                    }
                }

                const newDataString = JSON.stringify(newData);
                if (lastDataString !== newDataString || !isBackground) {
                    allQuestions = Array.isArray(newData) ? newData : [];
                    lastDataString = newDataString;
                    renderFilteredQuestions();
                }
            } catch (err) {
                if (!isBackground) {
                    questionList.innerHTML =
                        '<div class="state-note error">목록을 불러오지 못했습니다. 최신화를 다시 눌러 주세요.</div>';
                }
                console.error(err);
            }
        }

        /* =====================================================================
           [흐름 4] 관리자 — 날짜/키워드 필터 + 렌더 (최신순, 전체 표시)
           날짜 매칭 형식: `${y}. ${parseInt(m)}. ${parseInt(d)}.`  (원본 동일)
           ===================================================================== */
        function renderFilteredQuestions() {
            const filterDate = dateFilter.value;
            const kw = activeSearch.trim().toLowerCase();

            // q → 원본 인덱스 1회 매핑 (반복 indexOf 제거)
            const indexMap = new Map();
            allQuestions.forEach((q, i) => indexMap.set(q, i));

            let filtered = allQuestions;
            if (filterDate) {
                const [y, m, d] = filterDate.split("-");
                const searchStr = `${y}. ${parseInt(m)}. ${parseInt(d)}.`;
                filtered = filtered.filter(q => q.date.includes(searchStr));
            }
            if (kw) {
                filtered = filtered.filter(q => String(q.content).toLowerCase().includes(kw));
            }

            // 카운트 배지
            const answered = filtered.filter(q => {
                const v = pendingToggles.has(q.date) ? pendingToggles.get(q.date) : toBool(q.isAnswered);
                return v;
            }).length;
            listCount.textContent = filtered.length
                ? `${filtered.length}건 · 완료 ${answered}`
                : "";

            if (!filtered.length) {
                let msg;
                if (kw) msg = `‘${escapeHtml(activeSearch.trim())}’ 검색 결과가 없습니다.`;
                else if (filterDate) msg = "해당 날짜에 등록된 질문이 없습니다.";
                else msg = "아직 등록된 질문이 없습니다.";
                questionList.innerHTML = '<div class="state-note">' + msg + "</div>";
                return;
            }

            const frag = document.createDocumentFragment();

            // 페이지네이션 없이 전체를 최신순으로 렌더
            // 최신순 k번째 → filtered[filtered.length - 1 - k]
            for (let k = 0; k < filtered.length; k++) {
                const i = filtered.length - 1 - k;
                const q = filtered[i];

                let isChecked = toBool(q.isAnswered);
                if (pendingToggles.has(q.date)) isChecked = pendingToggles.get(q.date);

                const stableIndex = indexMap.get(q);
                const digits = q.date.replace(/[^0-9]/g, "");
                const chkId = "chk_" + stableIndex + "_" + digits;

                const card = document.createElement("div");
                card.className = isChecked ? "record answered" : "record";
                // 최신화로 막 끌어온 경우, 가장 최신(k===0) 카드만 1회 강조
                if (flashNewest && k === 0) {
                    card.classList.add("flash");
                    flashNewest = false;
                }
                card.innerHTML =
                    '<div class="rec-head">' +
                        '<span class="rec-time">' + escapeHtml(q.date) + '</span>' +
                        '<div class="rec-actions">' +
                            '<label class="chk" for="' + chkId + '">' +
                                '<input type="checkbox" id="' + chkId + '" ' + (isChecked ? "checked" : "") + ' />답변완료' +
                            '</label>' +
                            '<button type="button" class="del" title="이 질문 삭제" aria-label="삭제">' +
                                '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>' +
                            '</button>' +
                        '</div>' +
                    '</div>' +
                    '<p class="rec-body">' + escapeHtml(q.content) + '</p>';

                const checkbox = card.querySelector("input");
                const delBtn = card.querySelector(".del");

                /* ── 답변완료 토글 ──
                   POST { type:"toggleAnswer", adminKey, date, isAnswered } */
                checkbox.addEventListener("change", async function () {
                    const desired = this.checked;

                    // 1) 즉시 화면 반영 + 보류 등록(백그라운드 새로고침이 덮어쓰지 못하게)
                    card.classList.toggle("answered", desired);
                    pendingToggles.set(q.date, desired);
                    this.disabled = true;

                    try {
                        const result = await apiPost({
                            type: "toggleAnswer",
                            adminKey: adminKey,
                            date: q.date,
                            isAnswered: desired
                        });
                        if (result.result === "success") {
                            q.isAnswered = desired;
                            lastDataString = JSON.stringify(allQuestions);
                            refreshCount();
                        } else {
                            throw new Error(result.message || "서버 업데이트 실패");
                        }
                    } catch (err) {
                        alert("상태 저장 중 오류가 발생했습니다: " + err.message);
                        this.checked = !desired;                       // 롤백
                        card.classList.toggle("answered", this.checked);
                        pendingToggles.set(q.date, this.checked);
                    } finally {
                        this.disabled = false;
                    }
                });

                /* ── 개별 삭제 ──
                   POST { type:"deleteOne", adminKey, date } */
                delBtn.addEventListener("click", async function () {
                    if (!confirm("이 질문을 삭제하시겠습니까?\n\n" + q.content)) return;

                    delBtn.disabled = true;
                    checkbox.disabled = true;

                    try {
                        const result = await apiPost({
                            type: "deleteOne",
                            adminKey: adminKey,
                            date: q.date
                        });
                        if (result.result === "success") {
                            const idx = allQuestions.indexOf(q);
                            if (idx > -1) allQuestions.splice(idx, 1);
                            pendingToggles.delete(q.date);
                            lastDataString = JSON.stringify(allQuestions);
                            renderFilteredQuestions();   // 페이지 재계산(현재 페이지 유지·보정)
                        } else {
                            throw new Error(result.message || "삭제 실패");
                        }
                    } catch (err) {
                        alert("삭제 중 오류가 발생했습니다: " + err.message);
                        delBtn.disabled = false;
                        checkbox.disabled = false;
                    }
                });

                frag.appendChild(card);
            }

            questionList.replaceChildren(frag);   // 1회 교체로 reflow 최소화
        }

        // 카운트 배지만 가볍게 갱신
        function refreshCount() {
            const filterDate = dateFilter.value;
            let filtered = allQuestions;
            if (filterDate) {
                const [y, m, d] = filterDate.split("-");
                const searchStr = `${y}. ${parseInt(m)}. ${parseInt(d)}.`;
                filtered = allQuestions.filter(q => q.date.includes(searchStr));
            }
            const answered = filtered.filter(q => {
                const v = pendingToggles.has(q.date) ? pendingToggles.get(q.date) : toBool(q.isAnswered);
                return v;
            }).length;
            listCount.textContent = filtered.length ? `${filtered.length}건 · 완료 ${answered}` : "";
        }

        /* =====================================================================
           [흐름 5] 관리자 — 전체 삭제
           POST { type:"deleteAll", adminKey }
           ===================================================================== */
        deleteAllBtn.addEventListener("click", async function () {
            if (!confirm("경고: 등록된 모든 질문이 구글 시트에서 삭제됩니다. 계속할까요?")) return;

            const original = this.textContent;
            this.textContent = "삭제 중…";
            this.disabled = true;

            try {
                const result = await apiPost({ type: "deleteAll", adminKey: adminKey });
                if (result.result === "success") {
                    alert("모든 질문이 삭제되었습니다.");
                    allQuestions = [];
                    lastDataString = "";
                    pendingToggles.clear();
                    renderFilteredQuestions();
                } else {
                    throw new Error(result.message || "삭제 실패");
                }
            } catch (err) {
                alert("전체 삭제 중 오류가 발생했습니다: " + err.message);
            } finally {
                this.textContent = original;
                this.disabled = false;
            }
        });

        /* ── 필터 / 최신화 / 검색 ─────────────────────────────── */
        dateFilter.addEventListener("change", renderFilteredQuestions);

        // 검색하기: 입력된 키워드가 포함된 질문만 표시
        function runSearch() {
            activeSearch = searchKeyword.value.trim();
            renderFilteredQuestions();
            questionList.scrollIntoView({ behavior: "smooth", block: "start" });
        }
        searchBtn.addEventListener("click", runSearch);
        searchKeyword.addEventListener("keydown", (e) => { if (e.key === "Enter") runSearch(); });

        refreshDataBtn.addEventListener("click", async () => {
            // 최신화 = '방금 들어온 질문을 지금 확인하고 싶다'.
            // (1) 날짜 필터·검색 키워드를 모두 리셋해 전체가 보이게 하고,
            // (2) 가장 최신 질문 카드를 잠깐 강조한다.
            dateFilter.value = "";
            searchKeyword.value = "";
            activeSearch = "";
            flashNewest = true;
            await fetchQuestions(false);
            window.scrollTo({ top: 0, behavior: "smooth" });
        });

        /* ── 백그라운드 폴링(관리자 모드에서만) ─────────────── */
        function startPolling() {
            stopPolling();
            pollTimer = setInterval(() => {
                if (adminMode.style.display === "block") fetchQuestions(true);
            }, POLL_MS);
        }
        function stopPolling() {
            if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
        }

        /* ── 화면이 스마트폰 크기로 줄면 관리자 모드 강제 종료 ──
           (데스크톱에서 관리자 진입 후 창을 좁혀도 노출되지 않도록) */
        window.matchMedia(MOBILE_QUERY).addEventListener("change", (e) => {
            if (e.matches && adminMode.style.display === "block") exitAdmin();
        });

        /* ── 공개 목록: 최초 로드 시 조회 ─────────────────────── */
        fetchPublicQuestions(true);

        /* ── 탭으로 되돌아오면(사용자 모드일 때) 조용히 최신화 ── */
        document.addEventListener("visibilitychange", () => {
            if (!document.hidden && adminMode.style.display !== "block") {
                fetchPublicQuestions(false);
            }
        });
    </script>
</body>

</html>
